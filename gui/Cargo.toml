[package]
name = "c96-gui"
version = "0.1.0"
edition = "2021"
description = "C96 阶段 E — Tauri v2 GUI 骨架 + WebView2(webview2-rs) 自控窗口"
build = "build.rs"

# E1：Tauri v2（默认 WebView2）。与 CLI（根 Cargo.toml）分离为独立 crate，
# 避免把 Tauri 重量级依赖树带进零依赖核心的 build/test 循环。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# E1：pin 到 2.12（官方建议用 with_webview 时至少 pin 到 minor），
# 其 webview2-com 依赖为 ^0.39，下面 target 依赖与之对齐以共用同一类型。
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F：复用根 crate 的存储层（统一 KB 文件 + 指纹去重 + 30 天 TTL）
c96 = { path = "..", package = "C96" }
tauri-plugin-single-instance = "2"

# E1：webview2-rs（microsoft/webview2-rs 的 webview2-com）+ Win32 绑定。
# 仅 Windows；版本与 Tauri 2.12 的 webview2-com ^0.39 / windows ^0.62 对齐。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
# #[implement] 宏生成的代码直接引用 windows_core::，需要显式链接（与 windows 0.62 同版本）
windows-core = "0.62"

[[bin]]
name = "c96-gui"
path = "src/main.rs"
